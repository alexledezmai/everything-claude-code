name: NES Runtime Gate

on:
  push:
    branches:
      - nes-v0.1-foundation
  pull_request:
    paths:
      - 'nes/**'
      - '.github/workflows/nes-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: NES RC Full Suite (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime
        run: node --version

      - name: Run full NES self-test
        working-directory: nes
        run: npm run selftest

      - name: Run project detection
        working-directory: nes
        run: npm run detect

  portability:
    name: NES RC Portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime
        run: node --version

      - name: Bootstrap self-test
        working-directory: nes
        run: node tests/bootstrap-selftest.js

      - name: Hardening self-test
        working-directory: nes
        run: node tests/hardening-selftest.js

      - name: Release candidate self-test
        working-directory: nes
        run: node tests/rc-selftest.js

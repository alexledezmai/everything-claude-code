name: NES Runtime Gate

on:
  push:
    branches:
      - nes-v0.1-foundation
  pull_request:
    paths:
      - 'nes/**'
      - '.github/workflows/nes-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nes-0-1a:
    name: NES-0.1A Foundation Runtime Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime
        run: node --version

      - name: Run NES self-test
        working-directory: nes
        run: npm run selftest

      - name: Run project detection
        working-directory: nes
        run: npm run detect

      - name: Gate summary
        working-directory: nes
        run: |
          echo 'NES-0.1A runtime gate completed.'
          echo 'Required evidence:'
          echo '- MYVO-2.4C baseline: 10/10 PASS'
          echo '- Negative control: exactly 1 expected failure'
          echo '- Project detector: Node runtime detected'
